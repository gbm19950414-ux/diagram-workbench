name: Verify Diagram Workbench
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare Graphviz
        run: brew install graphviz
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Prepare pinned renderer
        run: node bin/diagram-workbench.mjs setup --project .
      - name: Run native integration tests
        run: npm run test:integration
      - name: Check release package
        run: |
          npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const files=new Set(JSON.parse(s)[0].files.map(f=>f.path));for(const path of ["LICENSE","README.md","bin/diagram-workbench.mjs","skills/diagram-workbench/SKILL.md","skills/diagram-workbench/references/architecture-views.md","docs/installation.md"]){if(!files.has(path))throw Error("Missing from package: "+path)}})'
      - name: Run installed package example
        run: node scripts/smoke-package.mjs
      - name: Test skill installation
        run: sh scripts/test-install-skill.sh
